<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketch Clock – test gallery</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { overflow: auto; height: auto; }
    body { -webkit-app-region: no-drag; padding: 16px; font: 13px system-ui, sans-serif; color: #444; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
    figure { margin: 0; border: 1px solid #c9c6bd; cursor: pointer; }
    figure svg { display: block; width: 100%; }
    figcaption { padding: 4px 8px; border-top: 1px solid #c9c6bd; }
  </style>
</head>
<body>
  <p>Static renders of edge-case times. Click any tile to watch it draw.</p>
  <div class="grid" id="grid"></div>

  <script src="js/rng.js"></script>
  <script src="js/format.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/digits.js"></script>
  <script src="js/strokefont.js"></script>
  <script src="js/route.js"></script>
  <script src="js/hatch.js"></script>
  <script src="js/artwork.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/animator.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
